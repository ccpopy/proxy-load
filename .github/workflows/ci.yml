name: Regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - run: npm run build:web
      - run: npm run test:frontend
      - run: npm run test:signing
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Native TCP half-close acceptance
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_half_close -- --ignored
      - name: Native TCP environment baseline
        if: always()
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked native_tcp_half_close_baseline -- --ignored
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Windows release portable update handoff
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $env:PORTABLE_UPDATE_HELPER = Join-Path $metadata.target_directory 'release/proxy-load-tauri.exe'
          node --test scripts/portable-update.test.mjs
