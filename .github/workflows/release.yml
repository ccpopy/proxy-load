name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to upload assets to"
        required: true
        default: "v26.9.11"
      target:
        description: "Build target"
        required: true
        type: choice
        default: "windows-x64"
        options:
          - all
          - windows-x64
          - linux-x64
          - macos-aarch64
          - macos-x64

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

  prepare:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Resolve build target
        id: matrix
        shell: bash
        env:
          TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.target || 'all' }}
        run: |
          case "$TARGET" in
            all)
              echo 'matrix={"include":[{"label":"linux-x64","os":"ubuntu-22.04","args":"","rust-target":""},{"label":"windows-x64","os":"windows-latest","args":"","rust-target":""},{"label":"macos-aarch64","os":"macos-26","args":"--target aarch64-apple-darwin","rust-target":"aarch64-apple-darwin"},{"label":"macos-x64","os":"macos-26-intel","args":"--target x86_64-apple-darwin","rust-target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
              ;;
            linux-x64)
              echo 'matrix={"include":[{"label":"linux-x64","os":"ubuntu-22.04","args":"","rust-target":""}]}' >> "$GITHUB_OUTPUT"
              ;;
            windows-x64)
              echo 'matrix={"include":[{"label":"windows-x64","os":"windows-latest","args":"","rust-target":""}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-aarch64)
              echo 'matrix={"include":[{"label":"macos-aarch64","os":"macos-26","args":"--target aarch64-apple-darwin","rust-target":"aarch64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
              ;;
            macos-x64)
              echo 'matrix={"include":[{"label":"macos-x64","os":"macos-26-intel","args":"--target x86_64-apple-darwin","rust-target":"x86_64-apple-darwin"}]}' >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported build target: $TARGET" >&2
              exit 1
              ;;
          esac

  build:
    name: Build ${{ matrix.label }}
    needs: [prepare, checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust target
        if: matrix.rust-target != ''
        run: rustup target add ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Read package version
        id: package-version
        shell: bash
        run: |
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); console.log('version=' + pkg.version)" >> "$GITHUB_OUTPUT"

      - name: Validate update signing configuration
        env:
          PROXY_LOAD_UPDATE_PRIVATE_KEY: ${{ secrets.PROXY_LOAD_UPDATE_PRIVATE_KEY }}
          PROXY_LOAD_UPDATE_PUBLIC_KEY: ${{ vars.PROXY_LOAD_UPDATE_PUBLIC_KEY }}
          PROXY_LOAD_UPDATE_KEY_PASSWORD: ${{ secrets.PROXY_LOAD_UPDATE_KEY_PASSWORD }}
        run: node scripts/update-signing.mjs check

      - name: Build Tauri bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@action-v0.6.2
        env:
          PROXY_LOAD_UPDATE_PUBLIC_KEY: ${{ vars.PROXY_LOAD_UPDATE_PUBLIC_KEY }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}

      - name: Sign and upload local build artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
          BUILD_LABEL: ${{ matrix.label }}
          TAURI_ARTIFACT_PATHS: ${{ steps.tauri-build.outputs.artifactPaths }}
          PROXY_LOAD_UPDATE_PRIVATE_KEY: ${{ secrets.PROXY_LOAD_UPDATE_PRIVATE_KEY }}
          PROXY_LOAD_UPDATE_PUBLIC_KEY: ${{ vars.PROXY_LOAD_UPDATE_PUBLIC_KEY }}
          PROXY_LOAD_UPDATE_KEY_PASSWORD: ${{ secrets.PROXY_LOAD_UPDATE_KEY_PASSWORD }}
        run: node scripts/publish-signed-release.mjs

  publish:
    name: Publish signed release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}
      - name: Publish only after every selected build succeeds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --notes-file RELEASE_NOTES.md

